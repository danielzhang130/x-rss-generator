services: 
  ngnix:
    restart: always
    image: nginx:latest   
    ports:     
      - "5000:80"   
    volumes:      
      - ../rss:/usr/share/nginx/html:ro
    depends_on:
      - rss

  rss:   
    restart: always
    build: .
    volumes:      
      - ../rss:/rss
      - ./config.py:/config.py
      - ./cookies:/cookies
